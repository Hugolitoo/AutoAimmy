name: AutoAimmy release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Numeric release version (example: 0.1.2)'
        required: true
        type: string
      channel:
        description: Release channel
        default: test
        type: choice
        options: [test, stable]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Validate updater
        shell: powershell
        run: ./tests/UpdaterChecks.ps1
      - name: Validate saved player profiles
        shell: powershell
        run: ./tests/PlayerProfileChecks.ps1
      - name: Validate launcher shortcut repair
        shell: powershell
        run: ./tests/ClientChecks.ps1
      - name: Validate automatic game settings import
        shell: powershell
        run: ./tests/AutomaticSettingsChecks.ps1
      - name: Validate actual local OCR
        shell: powershell
        run: |
          dotnet build tests/VisualOcrChecks/VisualOcrChecks.csproj -c Release -p:Platform=x64 --nologo -v:q
          if ($LASTEXITCODE -ne 0) { throw 'OCR build failed.' }
          dotnet tests/VisualOcrChecks/bin/x64/Release/net8.0-windows10.0.19041.0/VisualOcrChecks.dll
          if ($LASTEXITCODE -ne 0) { throw 'Windows OCR validation failed.' }
      - name: Validate passive Windows observer
        shell: powershell
        run: dotnet run --project tests/WindowsObserverChecks/WindowsObserverChecks.csproj -c Release
      - name: Build tested self-contained distribution
        shell: powershell
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_CHANNEL: ${{ inputs.channel }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: ./scripts/Build-Release.ps1 -Version $env:RELEASE_VERSION -Channel $env:RELEASE_CHANNEL -Repository $env:RELEASE_REPOSITORY
      - name: Validate local UI and output defaults
        shell: powershell
        run: |
          dotnet build tests/LocalUiChecks/LocalUiChecks.csproj -c Release -p:Platform=x64 --nologo -v:q
          if ($LASTEXITCODE -ne 0) { throw 'UI test build failed.' }
          dotnet tests/LocalUiChecks/bin/x64/Release/net8.0-windows10.0.19041.0/LocalUiChecks.dll artifacts/ui-checks
          if ($LASTEXITCODE -ne 0) { throw 'UI validation failed.' }
      - name: Publish release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_CHANNEL: ${{ inputs.channel }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: |
          $assets = @("artifacts/$env:RELEASE_VERSION/AutoAimmy-win-x64.zip", "artifacts/$env:RELEASE_VERSION/AutoAimmy-update-win-x64.zip", "artifacts/$env:RELEASE_VERSION/manifest.json", "artifacts/$env:RELEASE_VERSION/Reparer-mise-a-jour.cmd")
          # A new learning runtime is optional. Normal core releases keep using
          # the existing package URL and hash in learning-runtime.json.
          $runtimeAsset = "artifacts/$env:RELEASE_VERSION/AutoAimmy-learning-win-x64.zip"
          if (Test-Path -LiteralPath $runtimeAsset -PathType Leaf) { $assets += $runtimeAsset }
          $arguments = @('release', 'create', "v$env:RELEASE_VERSION", '--repo', $env:RELEASE_REPOSITORY, '--target', '${{ github.sha }}', '--title', "AutoAimmy $env:RELEASE_VERSION", '--notes', 'Experimental local R6 recording, camera-response calibration, adaptive profiles and optional assistance. Detector comparison and local training can run automatically while R6 is out of the foreground, after at least 40 human-reviewed images from two sessions. The portable training engine downloads once from the release pinned in the application manifest; compatible classic YOLOv8 ONNX exports can reconstruct training weights after output-equivalence checks. Real gameplay improvement remains unverified. Download AutoAimmy-win-x64.zip for the first installation. Existing installations use the updater. Player data and models are not included. Guide: https://github.com/Hugolitoo/AutoAimmy/blob/main/docs/Local-Automation-0.3.md')
          if ($env:RELEASE_CHANNEL -eq 'test') { $arguments += '--prerelease' }
          & gh @arguments @assets
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed.' }
